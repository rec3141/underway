# The underway dashboard on a machine that runs only Docker.
#   docker compose up -d        start it (it also starts itself after a reboot)
#   docker compose down         stop it
#   docker compose logs -f      watch what it is doing
# Everything it keeps is in UNDERWAY_DATA (default: the folder beside this file);
# settings are made on the site's /settings page, not here.
name: underway
services:
  underway:
    image: underway:${UNDERWAY_VERSION:-latest}
    container_name: underway
    restart: unless-stopped
    ports:
      - "${UNDERWAY_HTTP_PORT:-80}:80"
    volumes:
      - ${UNDERWAY_DATA:-./data}:/underway
      # A host that mounts the ship shares itself (or a Windows machine with mapped
      # drives) can hand them in instead of letting the container mount them:
      # - /mnt/ship/Data:/mnt/ship/Data
      # - /mnt/ship/Share:/mnt/ship/Share
    # mounting the ship's SMB shares from inside the container needs these
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"
